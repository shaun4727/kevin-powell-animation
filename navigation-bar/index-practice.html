<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Premium SaaS Navigation</title>
        <link rel="stylesheet" href="index-practice.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="logo">
                <a href="/" class="brand-logo" aria-label="Acme Corp Home">
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <polygon points="12 2 2 22 22 22"></polygon>
                    </svg>
                    <span>AcmeCorp</span>
                </a>
            </div>
            <nav class="navigation-menu">
                <ul role="menubar" class="nav-list">
                    <li role="none" class="nav-link">About</li>
                    <li role="none" class="has-dropdown nav-item">
                        <button
                            class="btn nav-link dropdown-trigger"
                            aria-haspopup="true"
                            aria-controls="product-menu"
                            aria-expanded="false"
                        >
                            Products
                            <svg
                                class="chevron"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div id="product-menu" class="dropdown-menu">
                            <ul role="menu" class="dropdown-list">
                                <li role="none">
                                    <a
                                        href="#"
                                        class="dropdown-link"
                                        role="menuitem"
                                        >Payments</a
                                    >
                                </li>
                                <li role="none">
                                    <a
                                        href="#"
                                        class="dropdown-link"
                                        role="menuitem"
                                        >Billing</a
                                    >
                                </li>
                                <li role="none">
                                    <a
                                        href="#"
                                        class="dropdown-link"
                                        role="menuitem"
                                        >Connect</a
                                    >
                                </li>
                                <li role="none" class="dropdown-divider"></li>
                                <li role="none">
                                    <a
                                        href="#"
                                        class="dropdown-link"
                                        role="menuitem"
                                        >Pricing Overview</a
                                    >
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li role="none">
                        <button
                            class="btn nav-link"
                            aria-haspopup="true"
                            aria-controls=""
                            aria-expanded="false"
                        >
                            Resources
                            <svg
                                class="chevron"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </li>
                    <li role="none" class="nav-link">Enterprise</li>
                </ul>
            </nav>
            <div class="sign-up">
                <a href="#" id="sign-in" class="nav-link">Sign in</a>
                <a href="#" class="btn btn-primary">Contact Sales</a>
            </div>
        </header>
        <main style="height: 200vh; padding: 6rem 2rem">
            <h1>Building the Future of Commerce.</h1>
        </main>

        <script src="practice.js"></script>
    </body>
</html>
